version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  rust-toolchain:
    type: string
    default: stable
    description: >-
      Rust toolchain for the acceptance and smoke tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  base:
    docker:
      - image: cimg/base:stable
  # musl, with no Rust. Rust's musl toolchains need libgcc, which the
  # smoke-alpine job installs first, as any Alpine job using Rust must.
  alpine:
    docker:
      - image: alpine:3.24
  # Ships rustup on PATH with an older toolchain as its default, so the test
  # shows setup-rust reuses that rustup rather than installing its own.
  rust:
    docker:
      - image: cimg/rust:1.99.1
  arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-rust-go-{{ checksum "go.sum" }}-
            - setup-rust-go-
      - run: task lint
      - run: task lint-tasks
      - run: task lint-mod
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-rust-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Real rustup-init and toolchain downloads, and real crates built with them.
  # Runs on the go executor because the suite compiles setup-rust in TestMain.
  acceptance:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-rust-go-{{ checksum "go.sum" }}-
            - setup-rust-go-
      - run:
          name: Run acceptance tests
          command: task acceptance -- -skip '^TestAcceptance_InstallsOntoTheRealPath$'
          environment:
            SETUP_RUST_ACCEPTANCE_TOOLCHAIN: << pipeline.parameters.rust-toolchain >>
      - store_test_results:
          path: test-results

  # Cross-compiles setup-rust into ./dist and persists it to the workspace, so
  # the smoke jobs exercise exactly what publish would ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-rust-go-{{ checksum "go.sum" }}-
            - setup-rust-go-
      - run: task dry-run
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  smoke:
    description: >-
      Let setup-rust install rustup on this executor and choose where on PATH
      the proxies go, then run cargo and rustc in processes that sourced
      nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
    parameters:
      e:
        type: executor
        description: The executor to smoke test on.
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    executor: << parameters.e >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Rust onto PATH and run it afterwards
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_InstallsOntoTheRealPath
          environment:
            SETUP_RUST_BINARY: ./dist/setup-rust/<< parameters.platform >>/setup-rust<< parameters.ext >>
            SETUP_RUST_ACCEPTANCE_TOOLCHAIN: << pipeline.parameters.rust-toolchain >>
      - store_test_results:
          path: test-results

workflows:
  test-publish:
    jobs:
      - test
      - acceptance
      - build
      - smoke:
          name: smoke-linux-amd64
          e: base
          platform: linux/amd64
          requires: [build]
      - smoke:
          name: smoke-linux-arm64
          e: arm64
          platform: linux/arm64
          requires: [build]
      - smoke:
          name: smoke-alpine
          e: alpine
          platform: linux/amd64
          pre-steps:
            - run: apk add --no-cache libgcc
          requires: [build]
      - smoke:
          name: smoke-rust
          e: rust
          platform: linux/amd64
          requires: [build]
      - smoke:
          name: smoke-macos
          e: macos
          platform: darwin/arm64
          requires: [build]
      - smoke:
          name: smoke-windows
          e: windows
          platform: windows/amd64
          ext: ".exe"
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-rust-go
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-linux-amd64
            - smoke-linux-arm64
            - smoke-alpine
            - smoke-rust
            - smoke-macos
            - smoke-windows
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-rust-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
